name: ci
on:
  push:
    branches: [main]
  pull_request: {}
env:
  WRANGLER_SEND_METRICS: "false"
  CI: "true"
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typegen:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # the fixtures deployment: Workers Free rules, a production build and wrangler deploy --dry-run with the 8 MiB check
      - run: npm run deploy:dry-run
      - run: npm run check:prose
      - run: npm run check:hygiene # public tier; the private tier runs only in the pre-commit hook
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --project engine
      - run: uv run --locked --project engine ruff check engine/src engine/tests
      - run: uv run --locked --project engine ruff format --check engine/src engine/tests
      - run: uv run --locked --project engine pytest engine/tests -q
      # the BigQuery dialect offline: every model and test compiled with no credentials, scanned and parsed
      - run: uv run --locked --project engine staysignal warehouse compile-bigquery
      # the semantic catalog (MetricFlow SQL for DuckDB and BigQuery) is current with the semantic layer
      - run: uv run --locked --project engine staysignal semantic catalog --check
      # the purpose-scoped access policy (SPEC 17.2): the compiled policy and the BigQuery grant plan are current
      - run: uv run --locked --project engine staysignal policy compile --check
      # C1 across platforms: regenerate the canonical world on Linux and compare every macOS-made pin
      - run: uv run --locked --project engine staysignal world generate --profile canonical --out var/world
      - run: uv run --locked --project engine staysignal world verify --manifest data/world/manifest.json --dir var/world
      # the Scenario Lab's cohort cells (SPEC 15.2) are current with the canonical world
      - run: uv run --locked --project engine staysignal lab cells --check
  challenger:
    # C15: the optional SurvivalBoost extra (about 1 GB) and a smoke fit with n_iter=3 on the small world; the full
    # recorded run is results/challenger-*.json (uv run --project engine staysignal eval challenger)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --project engine --extra challenger
      - run: uv run --locked --project engine --extra challenger pytest engine/tests/baselines/test_survivalboost.py -q
  e2e:
    # SPEC 16.4: the Playwright screenshot and flow specs in the same amd64 image that makes the baselines
    # (npm run test:e2e), against the built app under wrangler dev in fixtures mode with the stub model and the fixture
    # runner; no Python and no model server. The comparison is exact, so a baseline made anywhere else fails here.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host --init
    env:
      HOME: /root
      SS_E2E_SCREENSHOTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: npm ci --no-audit --no-fund
      - run: npm run dev:keys
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
  sim:
    # the Scenario Lab's OASIS project (SPEC 15.1, Python 3.11): the stubs guard, no GPL distribution, the forum's
    # determinism and, once recordings exist, their replay hashes; no model server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.17"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --project sim
      - run: uvx ruff@0.17.0 check sim/src sim/tests
      - run: uvx ruff@0.17.0 format --check sim/src sim/tests
      - run: uv run --locked --project sim pytest sim/tests -q
  agent-eval-stub:
    # the 200-item agent eval with the scripted stub model against the built app under wrangler dev: proves the
    # harness, the pre-router and the refusal codes, and that no injected request gets through (SPEC 14.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run dev:keys
      - run: npm run build
      - run: node scripts/serve.ts --no-build
      - run: npm run eval:agent -- --model stub --assert
      - if: always()
        run: npm run stop
