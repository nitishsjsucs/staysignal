<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="architecture-light-title architecture-light-desc">
<title id="architecture-light-title">Architecture</title>
<desc id="architecture-light-desc">One Cloudflare Worker serves the React app, two agents (Durable Objects), a Workflow and the API. A Python engine builds the warehouse and fits the model locally; the public demo and CI serve fixtures exported from it, and in the public demo the WorkspaceAgent completes each engine job from its fixture as it is enqueued. Code: src/worker (agents, app.ts, workflows, warehouse), scripts/fixture-runner.ts and engine/src/staysignal</desc>
