<text x="28.0" y="75.0" font-size="15" fill="#52514e">One Cloudflare Worker serves the React app, two agents (Durable Objects), a Workflow and the API. A Python engine builds the</text>
<text x="28.0" y="96.0" font-size="15" fill="#52514e">warehouse and fits the model locally; the public demo and CI serve fixtures exported from it, and in the public demo the</text>
<text x="28.0" y="117.0" font-size="15" fill="#52514e">WorkspaceAgent completes each engine job from its fixture as it is enqueued.</text>
