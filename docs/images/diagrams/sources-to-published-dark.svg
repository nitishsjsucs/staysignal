<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="816" viewBox="0 0 1000 816" role="img" aria-labelledby="sources-to-published-dark-title sources-to-published-dark-desc">
<title id="sources-to-published-dark-title">From sources to a published forecast</title>
<desc id="sources-to-published-dark-desc">Each source lands once; the checks and the candidate run meet at the publication gate, which has three outcomes. Code: engine/src/staysignal (ingest, features, model, quality), warehouse/ (dbt) and src/worker/workflows/routine-workflow.ts</desc>
<style>text{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="0.5" y="0.5" width="999" height="815" rx="10" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="28.0" y="48.0" font-size="20" font-weight="600" fill="#ffffff">From sources to a published forecast</text>
<text x="28.0" y="75.0" font-size="15" fill="#c3c2b7">Each source lands once; the checks and the candidate run meet at the publication gate, which has three outcomes.</text>
