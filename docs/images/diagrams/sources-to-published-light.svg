<text x="28.0" y="48.0" font-size="20" font-weight="600" fill="#0b0b0b">From sources to a published forecast</text>
<text x="28.0" y="75.0" font-size="15" fill="#52514e">Each source lands once; the checks and the candidate run meet at the publication gate, which has three outcomes.</text>
