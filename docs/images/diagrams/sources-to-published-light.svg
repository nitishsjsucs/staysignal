<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="816" viewBox="0 0 1000 816" role="img" aria-labelledby="sources-to-published-light-title sources-to-published-light-desc">
<title id="sources-to-published-light-title">From sources to a published forecast</title>
<desc id="sources-to-published-light-desc">Each source lands once; the checks and the candidate run meet at the publication gate, which has three outcomes. Code: engine/src/staysignal (ingest, features, model, quality), warehouse/ (dbt) and src/worker/workflows/routine-workflow.ts</desc>
<style>text{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-variant-numeric:tabular-nums}</style>
