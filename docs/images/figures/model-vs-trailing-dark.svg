<title id="model-vs-trailing-dark-title">Count error against the trailing rate</title>
<desc id="model-vs-trailing-dark-desc">Mean absolute error on the same 6 quarterly origins for every model, 6 windows per company cell; lower is better. The model is below the trailing rate at 1 of 3 horizons for the company and 2 of 3 for organizations, too few windows to establish a difference. The monthly backtest (16 to 21 origins) is the headline answer. Synthetic data (fictional Larkspur Systems) · uv run --project engine staysignal eval backtest --futures 2000 · 2026-10-12 · results/model-comparison-2026-10-12.json</desc>
