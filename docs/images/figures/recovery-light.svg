<title id="recovery-light-title">Does the estimator recover a known truth?</title>
<desc id="recovery-light-desc">Each dot is one of the competing-risks model's 34 slopes, fitted on a world whose hazards have the model's own form; whiskers are 95% intervals and the diagonal is perfect recovery. Right: team shocks the model omits, against marginal targets from a separate world. Synthetic data (fictional Larkspur Systems) · uv run --project engine staysignal eval recovery and uv run --project engine staysignal eval recovery-shock · 2026-10-12 and 2026-10-13 · results/recovery-2026-10-12.json, results/recovery-shock-2026-10-13.json</desc>
