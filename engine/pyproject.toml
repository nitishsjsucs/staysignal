[project]
name = "staysignal-engine"
version = "0.1.0"
description = "StaySignal engine: synthetic world, warehouse, point-in-time features, competing-risks model, forecasts, evaluation and the local runner"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.0",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "pandas==3.0.6",
  "pyarrow==26.0.0",
  "duckdb==1.5.6",
  "dbt-core==1.12.5",
  "dbt-duckdb==1.11.0",
  "dbt-bigquery==1.12.1",
  "dbt-metricflow==0.15.0",
  "metricflow==0.213.0",
  "openlineage-python==1.53.0",
  "openlineage-dbt==1.53.0",
  "google-cloud-bigquery==3.46.1",
  "pyyaml==6.0.3",
  "sqlglot==30.22.0",
  "pyjwt==2.15.1",
  "cryptography==50.0.2",
  "httpx==0.28.1",
]

[project.optional-dependencies]
challenger = ["hazardous==0.2.0"]

[project.scripts]
staysignal = "staysignal.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.0",
  "hypothesis==6.168.3",
  "statsmodels==0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/staysignal"]

[tool.uv]
required-version = ">=0.12.17,<0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running tests excluded from the default CI run",
  "dbt: tests that drive dbt in process",
]
addopts = "-ra -m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "E741"]  # E741: statistical notation (O, E, V, l) is clearer here
