# Declared column lineage from the warehouse to the forecast (SPEC 13.2). The dbt manifest provides the warehouse part
# once the dbt layer lands (M2); the engine declares the feature and forecast edges, which dbt cannot see.
nodes:
  - { id: src_payroll, kind: source, label: "payroll vendor files", columns: [pay_basis_code, base_amount] }
  - { id: src_hris, kind: source, label: "HRIS records", columns: [record_id, effective_date, recorded_at] }
  - { id: src_ref_bands, kind: source, label: "pay bands", columns: [band_mid] }
  - { id: stg_payroll__lines, kind: staging, label: "stg_payroll__lines", columns: [pay_basis_code, base_amount, employee_key] }
  - { id: stg_map__pay_basis, kind: staging, label: "stg_map__pay_basis (active mapping)", columns: [pay_basis_code, multiplier] }
  - { id: stg_hris__records, kind: staging, label: "stg_hris__records", columns: [record_id, corrects_record_id] }
  - { id: int_hris__assignment_timeline, kind: intermediate, label: "int_hris__assignment_timeline", columns: [team_id, level, valid_from, valid_to] }
  - { id: int_comp__annualized, kind: intermediate, label: "int_comp__annualized", columns: [annual_base] }
  - { id: fct_comp_position, kind: restricted, label: "fct_comp_position", columns: [compa_ratio] }
  - { id: feature_snapshot, kind: feature, label: "feature snapshot (in memory)", columns: [comp_below_mid, comp_above_mid, tenure, manager_changes_180d] }
  - { id: forecast_run, kind: forecast, label: "forecast run (cohort aggregates)", columns: [expected] }
edges:
  - { from: src_payroll, to: stg_payroll__lines, columns: [[pay_basis_code, pay_basis_code], [base_amount, base_amount]] }
  - { from: stg_payroll__lines, to: stg_map__pay_basis, columns: [[pay_basis_code, pay_basis_code]] }
  - { from: stg_payroll__lines, to: int_comp__annualized, columns: [[base_amount, annual_base]] }
  - { from: stg_map__pay_basis, to: int_comp__annualized, columns: [[multiplier, annual_base]] }
  - { from: src_hris, to: stg_hris__records, columns: [[record_id, record_id]] }
  - { from: stg_hris__records, to: int_hris__assignment_timeline, columns: [[record_id, team_id]] }
  - { from: int_hris__assignment_timeline, to: fct_comp_position, columns: [[level, compa_ratio]] }
  - { from: src_ref_bands, to: fct_comp_position, columns: [[band_mid, compa_ratio]] }
  - { from: int_comp__annualized, to: fct_comp_position, columns: [[annual_base, compa_ratio]] }
  - { from: fct_comp_position, to: feature_snapshot, columns: [[compa_ratio, comp_below_mid], [compa_ratio, comp_above_mid]] }
  - { from: int_hris__assignment_timeline, to: feature_snapshot, columns: [[valid_from, tenure], [team_id, manager_changes_180d]] }
  - { from: feature_snapshot, to: forecast_run, columns: [[comp_below_mid, expected], [comp_above_mid, expected], [tenure, expected]] }
