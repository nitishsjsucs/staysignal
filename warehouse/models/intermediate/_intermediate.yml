version: 2

models:
  - name: int_hris__records_current
    description: Records known at the vintage with duplicates dropped, corrections applied and rescinded records removed.
    columns:
      - name: record_id
        data_tests: [unique, not_null]
  - name: int_hris__spell_records
    description: Current records assigned to employment spells in (effective date, recorded at, record id) order.
    columns:
      - name: record_id
        data_tests: [unique]
  - name: int_hris__spells
    description: One row per employment spell [start_date, end_date).
    data_tests:
      - unique_combination:
          arguments:
            columns: [employee_key, spell_no]
    columns:
      - name: start_date
        data_tests: [not_null]
      - name: cause
        data_tests:
          - accepted_values:
              arguments:
                values: [voluntary, involuntary, retirement]
  - name: int_hris__assignment_timeline
    description: SCD2 assignment timeline per spell.
  - name: int_hris__manager_timeline
    description: Net manager changes per spell.
  - name: int_hris__departures
    description: Departures known at the vintage, by cause.
  - name: int_comp__annualized
    description: Annualized base pay under the active payroll mapping.
  - name: int_org__team_events
  - name: int_org__teams
